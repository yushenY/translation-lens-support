<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfaf7"><title>川味小馆 · 菜单</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="menu">
<header class="masthead"><div class="brand"><span class="seal" aria-hidden="true">川</span><div><h1>川味小馆</h1><p>现点现做 · 家常川菜</p></div></div><span class="table">堂食菜单</span></header>
<nav aria-label="菜品分类"><button class="active" data-category="all" aria-pressed="true">推荐</button><button data-category="hot" aria-pressed="false">热菜</button><button data-category="staple" aria-pressed="false">主食</button></nav>
<section class="intro"><span class="eyebrow">今日精选</span><h2>好好吃一顿。</h2><p>熟悉的食材，热腾腾地上桌。</p></section>
<div id="dishes">
<article data-kind="hot"><div class="photo tofu" role="img" aria-label="红油中炖煮的豆腐与牛肉末，撒上葱花"></div><div class="details"><h3>麻婆豆腐</h3><p>嫩豆腐与牛肉末，用豆瓣酱、花椒和辣椒油炖煮。</p><div class="bottom"><span class="price">¥28</span><button class="add" aria-label="添加麻婆豆腐" data-name="麻婆豆腐" data-price="28">＋</button></div></div></article>
<article data-kind="hot"><div class="photo beef" role="img" aria-label="辣椒汤底中的牛肉片与蔬菜"></div><div class="details"><h3>水煮牛肉</h3><p>牛肉片与豆芽在辣汤中煮熟，淋上热油，加入干辣椒和花椒。</p><div class="bottom"><span class="price">¥68</span><button class="add" aria-label="添加水煮牛肉" data-name="水煮牛肉" data-price="68">＋</button></div></div></article>
<article data-kind="staple"><div class="photo rice" role="img" aria-label="虾仁、鸡蛋和豌豆炒饭"></div><div class="details"><h3>扬州炒饭</h3><p>米饭与虾仁、鸡蛋、豌豆和葱花，用大火翻炒。</p><div class="bottom"><span class="price">¥26</span><button class="add" aria-label="添加扬州炒饭" data-name="扬州炒饭" data-price="26">＋</button></div></div></article>
<article data-kind="staple"><div class="photo noodles" role="img" aria-label="拌有肉末和葱花的担担面"></div><div class="details"><h3>担担面</h3><p>细面煮熟后拌入芝麻酱与红油，配上炒猪肉末、芽菜和葱花。</p><div class="bottom"><span class="price">¥22</span><button class="add" aria-label="添加担担面" data-name="担担面" data-price="22">＋</button></div></div></article>
</div>
